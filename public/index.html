<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Conteonix</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f6f7fb;
      color: #172033;
    }

    main {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px #0001;
    }

    button,
    a {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 10px;
      border: 0;
      background: #222;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      margin: 4px;
    }

    .ok {
      color: #087443;
    }

    .bad {
      color: #a11;
    }

    .box {
      background: #f2f4f8;
      padding: 14px;
      border-radius: 10px;
      margin: 16px 0;
    }

    pre {
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <main>

    <h1>Conteonix</h1>

    <p>
      Backend de conexión con Mercado Libre.
    </p>

    <div
      id="status"
      class="box"
    >
      Consultando estado...
    </div>

    <a href="/auth/login">
      🔗 Conectar Mercado Libre
    </a>

    <button onclick="orders()">
      📦 Ver ventas
    </button>

    <button onclick="sync()">
      🔄 Sincronizar ahora
    </button>

    <pre id="output"></pre>

  </main>

  <script>

    async function status() {

      try {

        const r =
          await fetch('/api/status');

        const d =
          await r.json();

        document.getElementById(
          'status'
        ).innerHTML =
          d.connected
            ? `
              <strong class="ok">
                ✅ Mercado Libre conectado
              </strong>
              <br>
              Usuario:
              ${d.user?.nickname || d.user_id || 'OK'}
              <br>
              Redirect:
              ${d.redirect_uri}
            `
            : `
              <strong class="bad">
                ❌ Mercado Libre no conectado
              </strong>
              <br>
              Redirect:
              ${d.redirect_uri}
            `;

      } catch (e) {

        document.getElementById(
          'status'
        ).innerHTML = `
          <strong class="bad">
            ❌ Error al consultar el servidor
          </strong>
        `;

      }

    }

    async function orders() {

      const r =
        await fetch('/api/orders');

      const d =
        await r.json();

      document.getElementById(
        'output'
      ).textContent =
        JSON.stringify(
          d,
          null,
          2
        );

    }

    async function sync() {

      const r =
        await fetch(
          '/api/sync',
          {
            method: 'POST'
          }
        );

      const d =
        await r.json();

      document.getElementById(
        'output'
      ).textContent =
        JSON.stringify(
          d,
          null,
          2
        );

    }

    status();

  </script>

</body>

</html>
