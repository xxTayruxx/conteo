<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>Conteonix</title>

  <link
    rel="manifest"
    href="/manifest.json"
  >

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0b0b0b;
      color: #ffffff;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding:
        env(safe-area-inset-top)
        14px
        calc(20px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 2px 14px;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #aaa;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #777;
    }

    .dot.online {
      background: #36d17c;
      box-shadow:
        0 0 10px
        rgba(54,209,124,.7);
    }

    .hero {
      background:
        linear-gradient(
          145deg,
          #181818,
          #101010
        );

      border: 1px solid #272727;
      border-radius: 24px;
      padding: 24px 20px;
      margin-bottom: 14px;
    }

    .hero-label {
      color: #999;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .hero-value {
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .hero-sub {
      margin-top: 12px;
      color: #aaa;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);
      gap: 10px;
    }

    .card {
      background: #151515;
      border: 1px solid #252525;
      border-radius: 18px;
      padding: 17px;
      min-height: 110px;
    }

    .card-label {
      font-size: 12px;
      color: #909090;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 23px;
      font-weight: 850;
      letter-spacing: -.6px;
    }

    .card-small {
      margin-top: 7px;
      font-size: 11px;
      color: #777;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-weight: 800;
      color: #fff;
      background: #222;
      border: 1px solid #333;
      cursor: pointer;
    }

    .btn.primary {
      background: #fff;
      color: #000;
    }

    .btn:active {
      transform: scale(.98);
    }

    .order {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      background: #151515;
      border: 1px solid #252525;
      border-radius: 16px;

      padding: 15px;
      margin-bottom: 8px;
    }

    .order-main {
      min-width: 0;
    }

    .order-id {
      font-weight: 800;
      font-size: 14px;
    }

    .order-date {
      color: #777;
      font-size: 11px;
      margin-top: 5px;
    }

    .order-price {
      font-weight: 900;
      white-space: nowrap;
    }

    .connected-box {
      margin-top: 10px;
      padding: 13px;
      border-radius: 14px;
      background: #101b14;
      border: 1px solid #1f5032;
      color: #72e6a0;
      font-size: 13px;
    }

    .warning {
      margin-top: 10px;
      padding: 13px;
      border-radius: 14px;
      background: #1d1710;
      border: 1px solid #4a3218;
      color: #e9b56b;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #666;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #444;
      font-size: 11px;
      padding: 30px 0 10px;
    }

    @media (min-width: 700px) {

      .grid {
        grid-template-columns:
          repeat(4, 1fr);
      }

      .hero-value {
        font-size: 54px;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="brand">
      Conteonix
    </div>

    <div class="status">
      <span
        id="statusDot"
        class="dot"
      ></span>

      <span id="statusText">
        Conectando...
      </span>
    </div>

  </header>


  <section class="hero">

    <div class="hero-label">
      Ventas de hoy
    </div>

    <div
      id="todaySales"
      class="hero-value"
    >
      $0
    </div>

    <div
      id="todayUnits"
      class="hero-sub"
    >
      0 unidades vendidas
    </div>

  </section>


  <section class="grid">

    <div class="card">

      <div class="card-label">
        Cantidad
      </div>

      <div
        id="salesCount"
        class="card-value"
      >
        0
      </div>

      <div class="card-small">
        ventas hoy
      </div>

    </div>


    <div class="card">

      <div class="card-label">
        Publicidad
      </div>

      <div
        id="adCost"
        class="card-value"
      >
        $0
      </div>

      <div class="card-small">
        gasto Product Ads
      </div>

    </div>


    <div class="card">

      <div class="card-label">
        ROAS
      </div>

      <div
        id="roas"
        class="card-value"
      >
        0x
      </div>

      <div class="card-small">
        retorno publicidad
      </div>

    </div>


    <div class="card">

      <div class="card-label">
        ACOS
      </div>

      <div
        id="acos"
        class="card-value"
      >
        0%
      </div>

      <div class="card-small">
        publicidad / ventas
      </div>

    </div>

  </section>


  <div
    id="connectionBox"
  ></div>


  <div class="toolbar">

    <button
      class="btn primary"
      onclick="refreshAll()"
    >
      Actualizar
    </button>

    <button
      class="btn"
      onclick="enableNotifications()"
    >
      Activar alertas
    </button>

  </div>


  <section class="section">

    <div class="section-title">
      Últimas ventas
    </div>

    <div id="orders">
      <div class="empty">
        Cargando ventas...
      </div>
    </div>

  </section>


  <div class="footer">
    Conteonix · Mercado Libre
  </div>

</div>


<script>

  // ==========================================================
  // VARIABLES
  // ==========================================================

  let orders = [];
  let audioContext = null;

  // ==========================================================
  // FORMATO
  // ==========================================================

  function money(value) {

    return new Intl.NumberFormat(
      'es-AR',
      {
        style: 'currency',
        currency: 'ARS',
        maximumFractionDigits: 0
      }
    ).format(
      Number(value) || 0
    );

  }

  function dateText(value) {

    if (!value) {
      return '';
    }

    const date =
      new Date(value);

    return date.toLocaleString(
      'es-AR',
      {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      }
    );

  }

  // ==========================================================
  // AUDIO
  // ==========================================================

  function unlockAudio() {

    try {

      if (!audioContext) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }

      if (
        audioContext.state ===
        'suspended'
      ) {

        audioContext.resume();

      }

    } catch (error) {

      console.log(
        'Audio no disponible',
        error
      );

    }

  }

  document.addEventListener(
    'click',
    unlockAudio,
    {
      once: true
    }
  );


  function playSaleSound() {

    unlockAudio();

    if (!audioContext) {
      return;
    }

    const now =
      audioContext.currentTime;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      'square';

    oscillator.frequency.setValueAtTime(
      880,
      now
    );

    oscillator.frequency.setValueAtTime(
      1174,
      now + .09
    );

    oscillator.frequency.setValueAtTime(
      1568,
      now + .18
    );

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .35,
      now + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .5
    );

    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );

    oscillator.start(
      now
    );

    oscillator.stop(
      now + .55
    );

  }

  // ==========================================================
  // NOTIFICACIONES
  // ==========================================================

  async function enableNotifications() {

    if (
      !('Notification' in window)
    ) {

      alert(
        'Este navegador no soporta notificaciones.'
      );

      return;

    }

    try {

      const permission =
        await Notification.requestPermission();

      if (
        permission ===
        'granted'
      ) {

        new Notification(
          'Conteonix',
          {
            body:
              'Alertas de ventas activadas.'
          }
        );

        unlockAudio();

      }

    } catch (error) {

      console.error(
        error
      );

    }

  }


  function notifySale(order) {

    playSaleSound();

    if (
      'Notification' in window &&
      Notification.permission ===
        'granted'
    ) {

      new Notification(
        'Nueva venta',
        {
          body:
            `Venta #${order.id} · ${money(order.total_amount)}`,
          icon:
            '/icon-192.png',
          tag:
            `order-${order.id}`
        }
      );

    }

  }

  // ==========================================================
  // STATUS
  // ==========================================================

  async function loadStatus() {

    try {

      const response =
        await fetch(
          '/api/status'
        );

      const data =
        await response.json();

      const dot =
        document.getElementById(
          'statusDot'
        );

      const text =
        document.getElementById(
          'statusText'
        );

      if (
        data.connected
      ) {

        dot.classList.add(
          'online'
        );

        text.textContent =
          data.user?.nickname ||
          'Mercado Libre';

        document.getElementById(
          'connectionBox'
        ).innerHTML = `
          <div class="connected-box">
            Conectado como
            <strong>
              ${data.user?.nickname || ''}
            </strong>
          </div>
        `;

      } else {

        text.textContent =
          'Sin conectar';

        document.getElementById(
          'connectionBox'
        ).innerHTML = `
          <div class="warning">
            Mercado Libre no está conectado.
            <br><br>
            <button
              class="btn primary"
              onclick="location.href='/auth/login'"
            >
              Conectar Mercado Libre
            </button>
          </div>
        `;

      }

    } catch (error) {

      document.getElementById(
        'statusText'
      ).textContent =
        'Offline';

    }

  }

  // ==========================================================
  // ORDERS
  // ==========================================================

  async function loadOrders() {

    try {

      const response =
        await fetch(
          '/api/orders?limit=50'
        );

      const data =
        await response.json();

      if (!data.ok) {
        throw new Error(
          data.error
        );
      }

      orders =
        data.results || [];

      renderOrders();

      calculateSales();

    } catch (error) {

      console.error(
        error
      );

      document.getElementById(
        'orders'
      ).innerHTML = `
        <div class="empty">
          No se pudieron cargar las ventas.
        </div>
      `;

    }

  }


  function calculateSales() {

    const today =
      new Date();

    const y =
      today.getFullYear();

    const m =
      today.getMonth();

    const d =
      today.getDate();

    const todayOrders =
      orders.filter(
        order => {

          const date =
            new Date(
              order.date_created
            );

          return (
            date.getFullYear() === y &&
            date.getMonth() === m &&
            date.getDate() === d
          );

        }
      );

    let total = 0;
    let units = 0;

    for (
      const order
      of todayOrders
    ) {

      total +=
        Number(
          order.total_amount
        ) || 0;

      for (
        const item
        of (
          order.order_items ||
          []
        )
      ) {

        units +=
          Number(
            item.quantity
          ) || 0;

      }

    }

    document.getElementById(
      'todaySales'
    ).textContent =
      money(total);

    document.getElementById(
      'salesCount'
    ).textContent =
      todayOrders.length;

    document.getElementById(
      'todayUnits'
    ).textContent =
      `${units} unidades vendidas`;

  }


  function renderOrders() {

    const container =
      document.getElementById(
        'orders'
      );

    if (!orders.length) {

      container.innerHTML = `
        <div class="empty">
          Todavía no hay ventas.
        </div>
      `;

      return;

    }

    container.innerHTML =
      orders
        .slice(0, 20)
        .map(
          order => {

            return `
              <div class="order">

                <div class="order-main">

                  <div class="order-id">
                    Venta #${order.id}
                  </div>

                  <div class="order-date">
                    ${dateText(
                      order.date_created
                    )}
                  </div>

                </div>

                <div class="order-price">
                  ${money(
                    order.total_amount
                  )}
                </div>

              </div>
            `;

          }
        )
        .join('');

  }

  // ==========================================================
  // ADS
  // ==========================================================

  async function loadAds() {

    try {

      const response =
        await fetch(
          '/api/ads'
        );

      const data =
        await response.json();

      if (!data.ok) {
        return;
      }

      const summary =
        data.summary || {};

      document.getElementById(
        'adCost'
      ).textContent =
        money(
          summary.cost
        );

      document.getElementById(
        'roas'
      ).textContent =
        `${Number(
          summary.roas || 0
        ).toFixed(2)}x`;

      document.getElementById(
        'acos'
      ).textContent =
        `${Number(
          summary.acos || 0
        ).toFixed(1)}%`;

    } catch (error) {

      console.error(
        'ADS:',
        error
      );

    }

  }

  // ==========================================================
  // TODO JUNTO
  // ==========================================================

  async function refreshAll() {

    await loadStatus();

    await loadOrders();

    await loadAds();

  }

  // ==========================================================
  // TIEMPO REAL
  // ==========================================================

  function connectRealtime() {

    if (
      !window.EventSource
    ) {

      console.log(
        'EventSource no disponible'
      );

      return;

    }

    const source =
      new EventSource(
        '/api/events'
      );

    source.onopen =
      () => {

        console.log(
          'Tiempo real conectado'
        );

      };

    source.onmessage =
      event => {

        try {

          const data =
            JSON.parse(
              event.data
            );

          if (
            data.type ===
            'new_order'
          ) {

            console.log(
              'NUEVA VENTA',
              data.order
            );

            notifySale(
              data.order
            );

            refreshAll();

          }

        } catch (error) {

          console.error(
            error
          );

        }

      };

    source.onerror =
      () => {

        console.log(
          'Reconectando tiempo real...'
        );

      };

  }

  // ==========================================================
  // SERVICE WORKER
  // ==========================================================

  if (
    'serviceWorker' in
    navigator
  ) {

    navigator.serviceWorker
      .register(
        '/sw.js'
      )
      .catch(
        error =>
          console.log(
            'SW:',
            error
          )
      );

  }

  // ==========================================================
  // START
  // ==========================================================

  refreshAll();

  connectRealtime();

  setInterval(
    refreshAll,
    60000
  );

</script>

</body>
</html>
